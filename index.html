<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>OrbitX MCN</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/a-/ALV-UjWufNRZwo6-tyucp2_FHTKH_l4ALZbK_MxsZQo0FyUn5wVw6gI=s360-w360-h360" />
    <script>
      // Fix for libraries trying to overwrite fetch in read-only environments (like AI Studio iframes)
      (function() {
        try {
          var target = window;
          var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          if (!desc) {
            target = window.constructor.prototype;
            desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          }
          if (desc && desc.configurable) {
            var _fetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _fetch; },
              set: function(v) { _fetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
